name: Καθημερινή συλλογή τιμών

on:
  schedule:
    - cron: "15 5 * * *"   # κάθε μέρα 05:15 UTC (07:15 / 08:15 ώρα Ελλάδας)
  workflow_dispatch:        # κουμπί "Run workflow" για χειροκίνητη εκτέλεση

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Εγκατάσταση
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Συλλογή τιμών
        run: python collector/collect.py

      - name: Αποθήκευση δεδομένων
        if: always()
        run: |
          git config user.name "kalathi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Τιμές $(TZ=Europe/Athens date +%F)"
          git push
